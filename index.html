<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大阪馬拉松 Sub-4:15 訓練儀表板 (16:9 桌面優化版) · 第 4–21 週</title>
<style>
  :root{
    --bg:#0f1220; --card:#1a1e33; --card2:#212642; --text:#eef0ff; --muted:#9aa0c3;
    --speed:#ff5c6c; --mpace:#ff9f43; --lsd:#4d8cff; --easy:#3ddc97; --gym:#b57bff;
    --rest:#4a4f6e; --race:#ffd54d; --travel:#63d3e0; --ok:#3ddc97;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
  body{background:var(--bg);color:var(--text);min-height:100vh;padding:16px 20px 40px}
  .wrap{max-width:1600px;margin:0 auto}

  /* Header Section */
  .top-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
  .top-title-group{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:22px;letter-spacing:.5px;display:inline-flex;align-items:center;gap:8px}
  .sub{color:var(--muted);font-size:12px}
  .goal{display:inline-block;background:linear-gradient(90deg,#ff5c6c,#ff9f43);padding:4px 14px;border-radius:20px;font-weight:700;font-size:12px;color:#fff}

  /* Tabs */
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
  .tab{cursor:pointer;border:1px solid #34395c;background:var(--card);color:var(--muted);
       padding:5px 9px;border-radius:8px;font-size:11px;transition:.15s;font-weight:600}
  .tab:hover{color:var(--text)}
  .tab.active{background:linear-gradient(135deg,#4d8cff,#b57bff);color:#fff;border-color:transparent}
  .tab.done{box-shadow:inset 0 0 0 1px rgba(61,220,151,.5)}

  /* 16:9 Dashboard Top Section Layout */
  .dash-top{display:grid;grid-template-columns:320px 1fr;gap:12px;margin-bottom:12px}
  
  /* Left Panel: Stats & Progress */
  .left-summary{display:flex;flex-direction:column;gap:10px}
  .overview-card{background:var(--card);border-radius:14px;padding:12px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
  .overview-card h3{font-size:13px;margin-bottom:8px;color:var(--text);display:flex;justify-content:space-between;align-items:center}
  
  .progwrap{background:var(--card2);border-radius:10px;padding:8px 12px;font-size:11px;color:var(--muted)}
  .progwrap .top{display:flex;justify-content:space-between;margin-bottom:4px}
  .progwrap .top b{color:var(--text);font-size:12px}
  .track{background:#2a2f4e;border-radius:6px;height:8px;overflow:hidden}
  .fill2{height:100%;background:linear-gradient(90deg,#3ddc97,#4d8cff);transition:.3s}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
  .stat{background:var(--card2);border-radius:10px;padding:8px 4px;text-align:center}
  .stat .v{font-size:15px;font-weight:800;line-height:1.2}
  .stat .l{font-size:9.5px;color:var(--muted);margin-top:2px}
  .stat .ico{font-size:13px}

  /* Right Panel: Mileage Trend Bar + Focus/Advice Split */
  .right-dashboard{display:flex;flex-direction:column;gap:10px}
  
  .trend-box{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between}
  .trend-box h3{font-size:12.5px;margin-bottom:6px;color:var(--muted)}
  .bars{display:flex;align-items:flex-end;gap:4px;height:70px}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;height:100%;justify-content:flex-end}
  .bcol .bar{width:100%;max-width:28px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#4d8cff,#b57bff);transition:.2s}
  .bcol:hover .bar{filter:brightness(1.35)}
  .bcol.active .bar{background:linear-gradient(180deg,#ff9f43,#ff5c6c)}
  .bcol .bv{font-size:9px;color:var(--muted);font-weight:700}
  .bcol .bl{font-size:8.5px;color:var(--muted)}

  /* Panels for Focus and Advice */
  .panels{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:10px}
  .panel{background:var(--card);border-radius:12px;padding:10px 12px}
  .panel h4{font-size:12px;margin-bottom:6px;color:var(--race);display:flex;align-items:center;gap:4px}
  .panel.advice h4{color:var(--easy)}
  .panel ul{list-style:none;font-size:11.5px;color:var(--muted);line-height:1.6}
  .panel li b{color:var(--text)}

  /* Recovery Section */
  .rec{background:var(--card);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
  .rec h4{font-size:12px;margin-bottom:6px;color:var(--travel)}
  .recline{display:flex;gap:6px;flex-wrap:wrap}
  .chip{cursor:pointer;display:inline-flex;align-items:center;gap:5px;background:var(--card2);
        border:1px solid #34395c;padding:4px 9px;border-radius:16px;font-size:11px;color:var(--muted);transition:.15s;user-select:none}
  .chip:hover{color:var(--text)}
  .chip.on{background:rgba(61,220,151,.16);border-color:rgba(61,220,151,.55);color:var(--ok);font-weight:700}
  .chip .bx{width:12px;height:12px;border-radius:3px;border:1.5px solid #5a6089;display:inline-block;position:relative}
  .chip.on .bx{background:var(--ok);border-color:var(--ok)}
  .chip.on .bx:after{content:"✓";position:absolute;inset:0;font-size:9px;color:#0f1220;display:flex;align-items:center;justify-content:center;font-weight:900}
  .chip.milk.on{background:rgba(255,213,77,.14);border-color:rgba(255,213,77,.5);color:var(--race)}

  /* Week Nav Header */
  .weekhead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 8px;gap:8px}
  .weekhead h2{font-size:17px;display:flex;align-items:center;gap:8px}
  .weekhead .dates{color:var(--muted);font-size:12px;font-weight:normal}
  .badge{font-size:11px;padding:3px 9px;border-radius:8px;background:var(--card2);color:var(--muted)}
  .badge.race{background:rgba(255,213,77,.15);color:var(--race);border:1px solid rgba(255,213,77,.4)}
  .badge.holiday{background:rgba(99,211,224,.14);color:var(--travel);border:1px solid rgba(99,211,224,.4)}
  .nav button{cursor:pointer;background:var(--card2);color:var(--text);border:1px solid #34395c;
              padding:5px 14px;border-radius:8px;font-size:12px;font-weight:600;margin-left:4px}
  .nav button:disabled{opacity:.3;cursor:default}

  /* 16:9 Grid Layout - 7 Columns Inline Row for Desktop */
  .grid{display:grid;grid-template-columns:repeat(7, 1fr);gap:8px}
  .slot{background:rgba(255,255,255,.02);border:1px dashed #3a3f63;border-radius:12px;padding:6px;min-height:175px;display:flex;flex-direction:column}
  .slot.over{border-color:var(--mpace);background:rgba(255,159,67,.08)}
  
  .card{background:var(--card);border-radius:10px;padding:8px 10px;border-left:4px solid var(--rest);
        cursor:grab;transition:.15s;position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between}
  .card:active{cursor:grabbing}
  .card.drag{opacity:.4}
  .card:hover{background:var(--card2)}
  .card .hd{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted);margin-bottom:3px}
  .card .nm{font-size:12.5px;font-weight:800;margin-bottom:3px;line-height:1.35}
  .card .dt{font-size:11px;color:var(--muted);line-height:1.55}
  .card .dt b{color:var(--text)}
  .card.done{opacity:.6}
  .card.done .nm{text-decoration:line-through}
  .card.done:after{content:"✓ 完成";position:absolute;top:6px;right:8px;font-size:9.5px;font-weight:800;color:var(--ok);
                   background:rgba(61,220,151,.15);padding:1px 5px;border-radius:4px}
  .btn{cursor:pointer;margin-top:6px;width:100%;border:none;background:#2a2f4e;color:var(--muted);
       padding:5px;border-radius:6px;font-size:11px;font-weight:700;transition:.15s}
  .btn:hover{background:#34395c;color:var(--text)}
  .card.done .btn{background:rgba(61,220,151,.18);color:var(--ok)}
  .km{font-size:10px;color:var(--muted);margin-top:3px;font-weight:700}
  .tag{font-size:9.5px;padding:2px 6px;border-radius:5px;font-weight:700}
  
  .t-speed{background:rgba(255,92,108,.15);color:var(--speed)}
  .t-mpace{background:rgba(255,159,67,.15);color:var(--mpace)}
  .t-lsd{background:rgba(77,140,255,.15);color:var(--lsd)}
  .t-easy{background:rgba(61,220,151,.15);color:var(--easy)}
  .t-gym{background:rgba(181,123,255,.15);color:var(--gym)}
  .t-rest{background:rgba(90,95,128,.3);color:var(--muted)}
  .t-race{background:rgba(255,213,77,.18);color:var(--race)}
  .t-travel{background:rgba(99,211,224,.15);color:var(--travel)}
  .c-speed{border-color:var(--speed)} .c-mpace{border-color:var(--mpace)}
  .c-lsd{border-color:var(--lsd)} .c-easy{border-color:var(--easy)}
  .c-gym{border-color:var(--gym)} .c-rest{border-color:var(--rest)}
  .c-travel{border-color:var(--travel)}
  .c-race{border-color:var(--race);box-shadow:0 0 14px rgba(255,213,77,.12)}

  /* Bottom Controls Footer */
  .bottom-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:10px}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .dot{width:8px;height:8px;border-radius:2.5px;display:inline-block}
  
  .action-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .resetbtn{cursor:pointer;background:var(--card2);border:1px solid #34395c;color:var(--text);
            padding:5px 12px;border-radius:8px;font-size:11.5px;transition:.15s;font-weight:600}
  .resetbtn:hover{background:#34395c}
  .resetbtn.danger{background:transparent;color:var(--muted)}
  .resetbtn.danger:hover{color:#ff5c6c;border-color:#ff5c6c}

  /* Print Styles */
  @media print{
    body{background:#fff;color:#111;padding:0}
    .tabs,.trend-box,.nav,.legend,.action-btns,.progwrap,.btn,button{display:none!important}
    .dash-top{grid-template-columns:1fr 1fr}
    .grid{grid-template-columns:repeat(7,1fr)}
    .stat,.panel,.rec,.slot,.card{background:#fff!important;border:1px solid #ccc!important;box-shadow:none!important}
    .stat .v,.panel li b,.card .dt b{color:#111}
    .card .dt,.panel ul,.stat .l{color:#444}
  }

  /* Responsive Adjustments for Smaller Screens (Tablets / Phones) */
  @media(max-width:1200px){
    .dash-top{grid-template-columns:1fr}
    .panels{grid-template-columns:1fr 1fr}
    .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  }
  @media(max-width:700px){
    body{padding:12px 10px 40px}
    .panels{grid-template-columns:1fr}
    .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
    h1{font-size:18px}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- Top Header Banner -->
  <div class="top-header">
    <div class="top-title-group">
      <span class="goal">🎯 2027 大阪馬拉松 · Sub-4:15（6:00–6:02/km）</span>
      <h1>🏃 馬拉松訓練儀表板 <span style="font-size:13px;color:var(--muted);font-weight:normal">（第 4 – 21 週 · 16:9 桌面版）</span></h1>
    </div>
    <div class="sub">2025/10/26 – 2026/2/28 · 拖動卡片可改期 · 資料自動存於本機</div>
  </div>

  <!-- Week Selection Tabs -->
  <div class="tabs" id="tabs"></div>

  <!-- 16:9 Top Dashboard Layout Split -->
  <div class="dash-top">
    <!-- Left Column: Current Week Overview & Stats -->
    <div class="left-summary">
      <div class="overview-card">
        <h3><span>📊 本週統計摘要</span><span id="weekBadge" class="badge"></span></h3>
        
        <div class="progwrap">
          <div class="top"><span>進度</span><span><b id="doneTxt">0 / 0 課</b> · <span id="doneKm">0 km</span></span></div>
          <div class="track"><div class="fill2" id="progFill" style="width:0%"></div></div>
        </div>

        <div class="stats" id="stats"></div>
      </div>
    </div>

    <!-- Right Column: Widescreen Mileage Bar Chart + Focus & Recovery Split -->
    <div class="right-dashboard">
      <div class="trend-box">
        <h3>📈 21 週總跑量趨勢（km）— 點擊長條切換週次</h3>
        <div class="bars" id="bars"></div>
      </div>

      <div class="panels">
        <div class="panel"><h4>🎯 本週訓練重點</h4><ul id="focus"></ul></div>
        <div class="panel advice"><h4>💡 教練建議</h4><ul id="advice"></ul></div>
        <div class="rec">
          <h4>🧘 本週恢復紀錄</h4>
          <div class="recline" id="stretchRow"></div>
          <div class="recline" id="milkRow" style="margin-top:6px"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Week Navigation & Date Header -->
  <div class="weekhead">
    <h2><span id="weekTitle"></span> <span class="dates" id="weekDates"></span></h2>
    <span class="nav"><button id="prev">← 上一週</button><button id="next">下一週 →</button></span>
  </div>

  <!-- 7-Column Inline Weekly Schedule Grid -->
  <div class="grid" id="grid"></div>

  <!-- Bottom Legend and Action Controls -->
  <div class="bottom-row">
    <div class="legend">
      <span><i class="dot" style="background:var(--speed)"></i>速度</span>
      <span><i class="dot" style="background:var(--mpace)"></i>M-Pace</span>
      <span><i class="dot" style="background:var(--lsd)"></i>LSD</span>
      <span><i class="dot" style="background:var(--easy)"></i>輕鬆跑</span>
      <span><i class="dot" style="background:var(--gym)"></i>重訓</span>
      <span><i class="dot" style="background:var(--race)"></i>比賽</span>
      <span><i class="dot" style="background:var(--travel)"></i>旅遊</span>
      <span><i class="dot" style="background:var(--rest)"></i>休息</span>
    </div>

    <div class="action-btns">
      <button class="resetbtn" id="exportBtn">📥 匯出 JSON 備份</button>
      <button class="resetbtn" id="importBtn">📤 匯入備份還原</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
      <button class="resetbtn danger" id="resetBtn">清除紀錄</button>
    </div>
  </div>
</div>

});

// Render Mileage Trend Bar Chart
const barsEl=document.getElementById("bars");
W.forEach((w,i)=>{
  const tot=w.days.reduce((a,d)=>a+d[3],0);
  const col=document.createElement("div");
  col.className="bcol";
  col.innerHTML=`<span class="bv">${Math.round(tot)}</span><div class="bar" style="height:${Math.max(6,tot/48*100)}%"></div><span class="bl">W${w.w}</span>`;
  col.onclick=()=>show(i);
  barsEl.appendChild(col);
});

const order=w=>S.order[w]||[0,1,2,3,4,5,6];

function show(i){
  cur=i;const w=W[i];
  document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("active",j===i));
  document.querySelectorAll(".bcol").forEach((b,j)=>b.classList.toggle("active",j===i));
  document.getElementById("weekTitle").textContent=w.t;
  document.getElementById("weekDates").textContent="📅 "+w.d;
  const b=document.getElementById("weekBadge");
  b.textContent=w.race||w.holiday||"一週 4 跑 + 2 重訓";
  b.className="badge"+(w.race?" race":w.holiday?" holiday":"");

  document.getElementById("focus").innerHTML=w.focus.map(f=>`<li>▸ ${f}</li>`).join("");
  document.getElementById("advice").innerHTML=w.advice.map(f=>`<li>▸ ${f}</li>`).join("");

  renderGrid();updateStats();renderRec();
  document.getElementById("prev").disabled=i===0;
  document.getElementById("next").disabled=i===W.length-1;
}

function renderGrid(){
  const w=W[cur],g=document.getElementById("grid");g.innerHTML="";
  order(w.w).forEach((di,slot)=>{
    const[type,name,detail,km]=w.days[di];
    const slotEl=document.createElement("div");slotEl.className="slot";slotEl.dataset.slot=slot;
    const card=document.createElement("div");
    card.className="card "+CLS[type].split(" ")[0]+(S.done[w.w+"_"+di]?" done":"");
    card.draggable=true;card.dataset.di=di;
    
    card.innerHTML=`
      <div>
        <div class="hd"><span>${DOW[slot]}</span><span class="tag ${CLS[type].split(" ")[1]}">${TN[type]}</span></div>
        <div class="nm">${name}</div>
        <div class="dt">${detail||"—"}</div>
      </div>
      <div>
        ${km?`<div class="km">📏 約 ${km} km</div>`:""}
        ${(type==="rest"||type==="travel")?"":`<button class="btn">${S.done[w.w+"_"+di]?"✓ 已完成":"標記完成"}</button>`}
      </div>`;
      
    const btn=card.querySelector(".btn");
    if(btn)btn.onclick=()=>{
      const k=w.w+"_"+di;
      S.done[k]=!S.done[k];
      if(!S.done[k])delete S.done[k];
      save();renderGrid();updateStats();markTabs();
    };

    // Drag and Drop Logic
    card.addEventListener("dragstart",e=>{dragFrom=slot;card.classList.add("drag");e.dataTransfer.effectAllowed="move";});
    card.addEventListener("dragend",()=>{card.classList.remove("drag");document.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));});

    slotEl.addEventListener("dragover",e=>{e.preventDefault();slotEl.classList.add("over");});
    slotEl.addEventListener("dragleave",()=>slotEl.classList.remove("over"));
    slotEl.addEventListener("drop",e=>{
      e.preventDefault();slotEl.classList.remove("over");
      if(dragFrom===null||dragFrom===slot)return;
      const o=order(w.w).slice();const tmp=o[dragFrom];o[dragFrom]=o[slot];o[slot]=tmp;
      S.order[w.w]=o;save();renderGrid();
    });

    slotEl.appendChild(card);g.appendChild(slotEl);
  });
}

function updateStats(){
  const w=W[cur];
  const tot=w.days.reduce((a,d)=>a+d[3],0);
  const trainable=w.days.filter(d=>d[0]!=="rest"&&d[0]!=="travel");
  const doneIdx=order(w.w).filter(di=>S.done[w.w+"_"+di]);
  const doneKm=doneIdx.reduce((a,di)=>a+w.days[di][3],0);
  const doneCount=doneIdx.filter(di=>w.days[di][0]!=="rest"&&w.days[di][0]!=="travel").length;
  const runs=w.days.filter(d=>["speed","mpace","lsd","easy","race"].includes(d[0])).length;
  const gymN=w.days.filter(d=>d[0]==="gym").length;
  const runsDone=doneIdx.filter(di=>["speed","mpace","lsd","easy","race"].includes(w.days[di][0])).length;
  const gymDone=doneIdx.filter(di=>w.days[di][0]==="gym").length;
  const pct=trainable.length?Math.round(doneCount/trainable.length*100):0;

  document.getElementById("doneTxt").textContent=`${doneCount} / ${trainable.length} 課`;
  document.getElementById("doneKm").textContent=`已完成 ${doneKm.toFixed(1)} km / 共 ${tot.toFixed(1)} km`;
  document.getElementById("progFill").style.width=pct+"%";

  const st=(S.stretch[w.w]||[false,false,false]).filter(Boolean).length;
  const milk=D[cur].map((d,i)=>i).filter(i=>["lsd","race","gym"].includes(D[cur][i][0]));
  const milkDone=milk.filter(i=>S.milk[w.w+"_"+i]).length;

  document.getElementById("stats").innerHTML=`
    <div class="stat"><div class="ico">🏃</div><div class="v">${tot.toFixed(1)}</div><div class="l">總跑量 km</div></div>
    <div class="stat"><div class="ico">✅</div><div class="v" style="color:var(--ok)">${doneKm.toFixed(1)}</div><div class="l">已完成 km</div></div>
    <div class="stat"><div class="ico">⏱️</div><div class="v">${w.h}h</div><div class="l">預計時數</div></div>
    <div class="stat"><div class="ico">👟</div><div class="v">${runsDone}/${runs}</div><div class="l">跑步課</div></div>
    <div class="stat"><div class="ico">🏋️</div><div class="v">${gymDone}/${gymN}</div><div class="l">重訓課</div></div>
    <div class="stat"><div class="ico">🧘</div><div class="v">${st}/3</div><div class="l">拉筋紀錄</div></div>`;
}

function renderRec(){
  const w=W[cur];
  const sr=document.getElementById("stretchRow");sr.innerHTML="";
  const st=S.stretch[w.w]||[false,false,false];
  ["第 1 次拉筋","第 2 次拉筋","第 3 次拉筋"].forEach((lb,i)=>{
    const c=document.createElement("div");c.className="chip"+(st[i]?" on":"");
    c.innerHTML=`<span class="bx"></span>${lb}`;
    c.onclick=()=>{const a=S.stretch[w.w]||[false,false,false];a[i]=!a[i];S.stretch[w.w]=a;save();renderRec();updateStats();};
    sr.appendChild(c);
  });
  const mr=document.getElementById("milkRow");mr.innerHTML="";
  D[cur].forEach((d,i)=>{
    if(!["lsd","race","gym"].includes(d[0]))return;
    const k=w.w+"_"+i;const on=!!S.milk[k];
    const slot=order(w.w).indexOf(i);
    const c=document.createElement("div");c.className="chip milk"+(on?" on":"");
    c.innerHTML=`<span class="bx"></span>🥛 ${DOW[slot]} ${d[1].replace(/<\/?[^>]+>/g,"").slice(0,12)} 後`;
    c.onclick=()=>{S.milk[k]=!S.milk[k];if(!S.milk[k])delete S.milk[k];save();renderRec();updateStats();};
    mr.appendChild(c);
  });
}

function markTabs(){
  W.forEach((w,i)=>{
    const tr=w.days.filter(d=>d[0]!=="rest"&&d[0]!=="travel");
    const all=tr.length>0&&tr.every(d=>{const j=w.days.indexOf(d);return !!S.done[w.w+"_"+j];});
    document.querySelectorAll(".tab")[i].classList.toggle("done",all);
  });
}

document.getElementById("prev").onclick=()=>show(Math.max(0,cur-1));
document.getElementById("next").onclick=()=>show(Math.min(W.length-1,cur+1));
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("確定清除所有完成/拖動/恢復紀錄？")){
    S={done:{},order:{},stretch:{},milk:{}};
    W.forEach(w=>S.order[w.w]=[0,1,2,3,4,5,6]);
    save();show(cur);markTabs();
  }
};

// JSON Export Backup
document.getElementById("exportBtn").onclick=()=>{
  const dataStr="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S,null,2));
  const a=document.createElement("a");
  const d=new Date();const ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  a.href=dataStr;a.download="osaka_marathon_backup_"+ds+".json";
  document.body.appendChild(a);a.click();a.remove();
};

// JSON Import Backup Restoration
const importFileInput=document.getElementById("importFile");
document.getElementById("importBtn").onclick=()=>importFileInput.click();
importFileInput.onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const imported=JSON.parse(ev.target.result);
      if(imported&&typeof imported==="object"&&(imported.done||imported.order||imported.stretch||imported.milk)){
        S=Object.assign({done:{},order:{},stretch:{},milk:{}},imported);
        W.forEach(w=>{if(!S.order[w.w])S.order[w.w]=[0,1,2,3,4,5,6];});
        save();show(cur);markTabs();
        alert("✅ 備份資料已成功匯入還原！");
      }else{alert("⚠️ 備份檔案格式不正確。");}
    }catch(err){alert("❌ 讀取檔案失敗，請確認是否為正確的 JSON 備份檔。");}
    importFileInput.value="";
  };
  reader.readAsText(file);
};

show(0);markTabs();
</script>
</body>
</html>
