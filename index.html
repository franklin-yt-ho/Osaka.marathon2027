// --- Google Drive API Integration ---
const CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com'; // 可選填，未填時預設走 LocalStorage + 手動匯入
const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
let tokenClient, accessToken = null, driveFileId = null;

function handleAuthClick() {
  if (!window.google) { alert('Google 服務載入中，請稍後再試'); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) return;
      accessToken = resp.access_token;
      document.getElementById('syncStatus').textContent = '☁️ 雲端同步中...';
      await syncWithGoogleDrive();
    }
  });
  tokenClient.requestAccessToken({prompt: 'consent'});
}

async function syncWithGoogleDrive() {
  if (!accessToken) return;
  try {
    const listResp = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const listData = await listResp.json();
    const file = listData.files && listData.files.find(f => f.name === 'osaka_marathon_data.json');

    if (file) {
      driveFileId = file.id;
      const fileResp = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const cloudData = await fileResp.json();
      if (cloudData) {
        S = Object.assign({done:{},order:{},stretch:{},milk:{}}, cloudData);
        saveLocal(); show(cur); markTabs();
      }
    } else {
      await saveToDrive();
    }
    document.getElementById('syncStatus').textContent = '✅ 已連結 Google Drive (自動即時同步)';
  } catch(e) {
    document.getElementById('syncStatus').textContent = '⚠️ 雲端同步失敗，切換為本機儲存';
  }
}

async function saveToDrive() {
  if (!accessToken) return;
  const metadata = { name: 'osaka_marathon_data.json', parents: ['appDataFolder'] };
  const formData = new FormData();
  formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  formData.append('file', new Blob([JSON.stringify(S)], { type: 'application/json' }));

  const url = driveFileId 
    ? `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`
    : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
  
  const method = driveFileId ? 'PATCH' : 'POST';
  const resp = await fetch(url, { method, headers: { Authorization: `Bearer ${accessToken}` }, body: formData });
  const data = await resp.json();
  if (data.id) driveFileId = data.id;
}

const CLS={gym:"c-gym t-gym",mpace:"c-mpace t-mpace",speed:"c-speed t-speed",lsd:"c-lsd t-lsd",easy:"c-easy t-easy",rest:"c-rest t-rest",race:"c-race t-race",travel:"c-travel t-travel"};
const TN={gym:"重訓",mpace:"M-Pace",speed:"速度",lsd:"LSD",easy:"輕鬆跑",rest:"休息",race:"比賽/關鍵課",travel:"旅遊/休假"};
const DOW=["週一","週二","週三","週四","週五","週六","週日"];
const KEY="osaka_plan_v1";

let S=JSON.parse(localStorage.getItem(KEY)||'{"done":{},"order":{},"stretch":{},"milk":{}}');
const saveLocal=()=>localStorage.setItem(KEY,JSON.stringify(S));
const save=()=>{ saveLocal(); if(accessToken) saveToDrive(); };

W.forEach((w,i)=>{w.days=D[i]; if(!S.order[w.w]) S.order[w.w]=[0,1,2,3,4,5,6];});

let cur=0, dragFrom=null;
const tabsEl=document.getElementById("tabs");
W.forEach((w,i)=>{const t=document.createElement("div");t.className="tab";t.textContent="W"+w.w;t.onclick=()=>show(i);tabsEl.appendChild(t)});
const barsEl=document.getElementById("bars");
W.forEach((w,i)=>{
  const tot=w.days.reduce((a,d)=>a+d[3],0);
  const col=document.createElement("div");col.className="bcol";
  col.innerHTML=`<span class="bv">${Math.round(tot)}</span><div class="bar" style="height:${Math.max(5,tot/48*100)}%"></div><span class="bl">W${w.w}</span>`;
  col.onclick=()=>show(i);barsEl.appendChild(col);
});

const order=w=>S.order[w]||[0,1,2,3,4,5,6];

function show(i){
  cur=i;const w=W[i];
  document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("active",j===i));
  document.querySelectorAll(".bcol").forEach((b,j)=>b.classList.toggle("active",j===i));
  document.getElementById("weekTitle").textContent=w.t;
  document.getElementById("weekDates").textContent="📅 "+w.d;
  const b=document.getElementById("weekBadge");
  b.textContent=w.race||w.holiday||"1 週 4 跑 + 2 重訓";
  
  document.getElementById("focus").innerHTML=w.focus.map(f=>`<li>▸ ${f}</li>`).join("");
  document.getElementById("advice").innerHTML=w.advice.map(f=>`<li>▸ ${f}</li>`).join("");

  renderGrid();updateStats();renderRec();
  document.getElementById("prev").disabled=i===0;
  document.getElementById("next").disabled=i===W.length-1;
}

function renderGrid(){
  const w=W[cur],g=document.getElementById("grid");g.innerHTML="";
  order(w.w).forEach((di,slot)=>{
    const[type,name,detail,km]=w.days[di];
    const slotEl=document.createElement("div");slotEl.className="slot";slotEl.dataset.slot=slot;
    const card=document.createElement("div");
    card.className="card "+CLS[type].split(" ")[0]+(S.done[w.w+"_"+di]?" done":"");
    card.draggable=true;
    card.innerHTML=`<div class="hd"><span>${DOW[slot]}</span><span class="tag ${CLS[type].split(" ")[1]}">${TN[type]}</span></div>
      <div class="nm">${name}</div><div class="dt">${detail||"—"}</div>
      ${km?`<div class="km" style="font-size:10px;color:var(--muted);margin-top:3px">📏 約 ${km} km</div>`:""}
      ${(type==="rest"||type==="travel")?"":`<button class="btn">${S.done[w.w+"_"+di]?"✓ 已完成":"標記完成"}</button>`}`;
    const btn=card.querySelector(".btn");
    if(btn)btn.onclick=()=>{const k=w.w+"_"+di;S.done[k]=!S.done[k];if(!S.done[k])delete S.done[k];save();renderGrid();updateStats();markTabs();};

    card.addEventListener("dragstart",e=>{dragFrom=slot;e.dataTransfer.effectAllowed="move";});
    slotEl.addEventListener("dragover",e=>e.preventDefault());
    slotEl.addEventListener("drop",e=>{
      e.preventDefault(); if(dragFrom===null||dragFrom===slot)return;
      const o=order(w.w).slice();const tmp=o[dragFrom];o[dragFrom]=o[slot];o[slot]=tmp;
      S.order[w.w]=o;save();renderGrid();
    });
    slotEl.appendChild(card);g.appendChild(slotEl);
  });
}

function updateStats(){
  const w=W[cur];
  const tot=w.days.reduce((a,d)=>a+d[3],0);
  const trainable=w.days.filter(d=>d[0]!=="rest"&&d[0]!=="travel");
  const doneIdx=order(w.w).filter(di=>S.done[w.w+"_"+di]);
  const doneKm=doneIdx.reduce((a,di)=>a+w.days[di][3],0);
  const doneCount=doneIdx.filter(di=>w.days[di][0]!=="rest"&&w.days[di][0]!=="travel").length;
  const pct=trainable.length?Math.round(doneCount/trainable.length*100):0;

  document.getElementById("doneTxt").textContent=`${doneCount} / ${trainable.length} 課`;
  document.getElementById("doneKm").textContent=`已完成 ${doneKm.toFixed(1)} km / 共 ${tot.toFixed(1)} km`;
  document.getElementById("progFill").style.width=pct+"%";

  const st=(S.stretch[w.w]||[false,false,false]).filter(Boolean).length;
  const milk=D[cur].map((d,i)=>i).filter(i=>["lsd","race","gym"].includes(D[cur][i][0]));
  const milkDone=milk.filter(i=>S.milk[w.w+"_"+i]).length;

  document.getElementById("stats").innerHTML=`
    <div class="stat"><div class="v">${tot.toFixed(1)}</div><div class="l">週總跑量</div></div>
    <div class="stat"><div class="v" style="color:var(--ok)">${doneKm.toFixed(1)}</div><div class="l">完成跑量</div></div>
    <div class="stat"><div class="v">${st}/3</div><div class="l">拉筋次數</div></div>`;
}

function renderRec(){
  const w=W[cur], sr=document.getElementById("stretchRow");sr.innerHTML="";
  const st=S.stretch[w.w]||[false,false,false];
  ["拉筋 1","拉筋 2","拉筋 3"].forEach((lb,i)=>{
    const c=document.createElement("div");c.className="chip"+(st[i]?" on":"");c.textContent=lb;
    c.onclick=()=>{const a=S.stretch[w.w]||[false,false,false];a[i]=!a[i];S.stretch[w.w]=a;save();renderRec();updateStats();};
    sr.appendChild(c);
  });
  const mr=document.getElementById("milkRow");mr.innerHTML="";
  D[cur].forEach((d,i)=>{
    if(!["lsd","race","gym"].includes(d[0]))return;
    const k=w.w+"_"+i, on=!!S.milk[k], slot=order(w.w).indexOf(i);
    const c=document.createElement("div");c.className="chip"+(on?" on":"");c.textContent=`🥛 ${DOW[slot]} 蛋白`;
    c.onclick=()=>{S.milk[k]=!S.milk[k];if(!S.milk[k])delete S.milk[k];save();renderRec();updateStats();};
    mr.appendChild(c);
  });
}

function markTabs(){
  W.forEach((w,i)=>{
    const tr=w.days.filter(d=>d[0]!=="rest"&&d[0]!=="travel");
    const all=tr.length>0&&tr.every(d=>{const j=w.days.indexOf(d);return !!S.done[w.w+"_"+j];});
    document.querySelectorAll(".tab")[i].classList.toggle("done",all);
  });
}

document.getElementById("prev").onclick=()=>show(Math.max(0,cur-1));
document.getElementById("next").onclick=()=>show(Math.min(W.length-1,cur+1));
document.getElementById("resetBtn").onclick=()=>{if(confirm("清除所有紀錄？")){S={done:{},order:{},stretch:{},milk:{}};W.forEach(w=>S.order[w.w]=[0,1,2,3,4,5,6]);save();show(cur);markTabs();}};

document.getElementById("exportBtn").onclick=()=>{
  const a=document.createElement("a");
  a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S,null,2));
  a.download=`osaka_marathon_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
};

const importFileInput=document.getElementById("importFile");
document.getElementById("importBtn").onclick=()=>importFileInput.click();
importFileInput.onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      S=Object.assign({done:{},order:{},stretch:{},milk:{}},JSON.parse(ev.target.result));
      save();show(cur);markTabs();alert("✅ 已成功匯入資料！");
    }catch(err){alert("❌ 檔案格式錯誤");}
  };
  reader.readAsText(file);
};

show(0);markTabs();
</script>
